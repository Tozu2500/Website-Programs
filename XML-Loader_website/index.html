<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML File Loader - Vanilla JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XML Data Loader</h1>
            <p>Load and visualize XML documents with JavaScript Promise functionality</p>
        </div>
        
        <div class="control-panel">
            <div class="input-group">
                <div class="file-input-wrapper">
                    <input type="file" id="xmlFile" class="file-input" accept="xml">

                </div>
                <input type="text" id="xmlUrl" class="url-input" placeholder="Or, enter an XML file URL...">
                <button id="loadBtn" class="btn btn-primary">Load XML</button>
            </div>
            
            <div class="input-group">
                <button id="clearBtn" class="btn btn-secondary">Clear Data</button>
            </div>

            <div class="sample-data">
                <button id="sampleBtn" class="sample-btn">Load Sample XML</button>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="color: white; font-size: 1.1rem;">Loading XML data...</p>
        </div>

        <div id="errorContainer"></div>

        <div id="dataDisplay" class="data-display">
            <h2 style="margin-bottom: 1rem; color: #1e293b">XML Content</h2>
            <div id="xmlContent" class="xml-tree"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
