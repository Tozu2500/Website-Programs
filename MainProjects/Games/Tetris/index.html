<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="left-panel">
            <div class="panel-section">
                <h2>HOLD</h2>
                <canvas id="holdCanvas" width="120" height="120"></canvas>
            </div>
            <div class="panel-section">
                <h2>SCORE</h2>
                <div id="score">0</div>
            </div>
            <div class="panel-section">
                <h2>LEVEL</h2>
                <div id="level">1</div>
            </div>
            <div class="panel-section">
                <h2>LINES</h2>
                <div id="lines">0</div>
            </div>
        </div>
        
        <div class="main-game">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div id="gameOver" class="game-over hidden">
                <h1>GAME OVER</h1>
                <p>Score: <span id="finalScore">0</span></p>
                <button id="restartButton">PLAY AGAIN</button>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="panel-section">
                <h2>NEXT</h2>
                <canvas id="nextCanvas1" width="120" height="120"></canvas>
                <canvas id="nextCanvas2" width="120" height="120"></canvas>
                <canvas id="nextCanvas3" width="120" height="120"></canvas>
            </div>
            <div class="panel-section controls-info">
                <h2>CONTROLS</h2>
                <div class="control-item">← → Move</div>
                <div class="control-item">↓ Soft Drop</div>
                <div class="control-item">Space Hard Drop</div>
                <div class="control-item">↑ / Z Rotate</div>
                <div class="control-item">C Hold</div>
                <div class="control-item">P Pause</div>
            </div>
        </div>
    </div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
