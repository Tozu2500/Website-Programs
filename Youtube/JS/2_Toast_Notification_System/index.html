<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Notifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Toast Notifications</h1>
        <p class="subtitle">Click the buttons to trigger different notification types</p>

        <div class="button-grid">
            <button class="trigger-btn btn-success" onclick="showToast('success')">
                Success
            </button>
            <button class="trigger-btn btn-error" onclick="showToast('error')">
                Error
            </button>
            <button class="trigger-btn btn-warning" onclick="showToast('warning')">
                Warning
            </button>
            <button class="trigger-btn btn-info" onclick="showToast('info')">
                Info
            </button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
