<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Explosion System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="toggle-controls" id="toggleBtn">Hide Controls</div>

    <div class="controls" id="controls">
        <h2>Particle Controls</h2>

        <div class="control-group">
            <label>Particle Count <span class="value-display" id="countValue">50</span></label>
            <input type="range" id="particleCount" min="10" max="200" value="50">
        </div>

        <div class="control-group">
            <label>Explosion Force <span class="value-display" id="forceValue">8</span> </label>
            <input type="range" id="explosionForce" min="1" max="20" value="8">
        </div>

        <div class="control-group">
            <label>Gravity <span class="value-display" id="gravityValue">0.2</span> </label>
            <input type="range" id="gravity" min="0" max="1" step="0.05" value="0.2">
        </div>

        <div class="control-group">
            <label>Particle Size <span class="value-display" id="sizeValue">4</span> </label>
            <input type="range" id="particleSize" min="1" max="15" value="4">
        </div>

        <div class="control-group">
            <label>Fade Speed <span class="value-display" id="fadeValue">0.02</span> </label>
            <input type="range" id="fadeSpeed" min="0.005" max="0.05" step="0.005" value="0.02">
        </div>

        <div class="control-group">
            <label>Particle Shape</label>
            <select id="particleShape">
                <option value="circle">Circle</option>
                <option value="square">Square</option>
                <option value="star">Star</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>

        <div class="control-group">
            <label>Color Mode</label>
            <select id="colorMode">
                <option value="rainbow">Rainbow</option>
                <option value="fire">Fire</option>
                <option value="ice">Ice</option>
                <option value="electric">Electric</option>
                <option value="random">Random</option>
            </select>
        </div>

        <div class="control-group">
            <label>Quick Colors</label>
            <div class="color-preset">
                <div class="color-swatch" style="background: linear-gradient(135deg, #ff6b6b, #ee5a6f)" data-mode="fire"></div>
                <div class="color-swatch" style="background: linear-gradient(135deg, #4facfe, #00f2fe)" data-mode="ice"></div>
                <div class="color-swatch" style="background: linear-gradient(135deg, #fa709a #fee140)" data-mode="rainbow"></div>
                <div class="color-swatch" style="background: linear-gradient(135deg, #a8edea, #fed6e3)" data-mode="electric"></div>
            </div>
        </div>

        <div class="button-group">
            <button id="clearBtn">Clear All</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <div class="stats">
        <div>Active Particles: <span id="particleCounter">0</span> </div>
        <div>Total Explosions: <span id="explosionCounter">0</span> </div>
        <div>FPS: <span id="fpsCounter">60</span> </div>
    </div>

    <div class="info">
        <strong style="color: #00d4ff;">How to use:</strong><br>
        Click anywhere to create explosions<br>
        Hold and drag for continued explosions<br>
        Adjust controls for custom effects<br>
        Watch particles as they react to gravity<br>
    </div>

    <script src="index.js"></script>
</body>
</html>
